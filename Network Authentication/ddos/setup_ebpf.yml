---
- name: Setup eBPF authentication on client nodes
  hosts: clients
  gather_facts: false
  vars:
    cwd: "/root/Rutgers/Authentication/packet-solutions"
    tc_obj: "tc_prog_kern_02.o"
    tc_sec: "tc_ip_hash"
    iface: "DATA1"
    mtu: 9000
    # Hardcoded key for now
    auth_key: "4b758f9498d3312616ecc261994376452a3b4c5d6e7f8091a2b3c4d5e6f708191a2b3c4d5e6f708192a3b4c5d6e7f8090a1b2c3d4e5f60718293a4b5c6d7e8f9"

  tasks:
    - name: Check node is reachable
      wait_for_connection:
        timeout: 15

    - name: Get node IP from nodes.txt on control machine
      set_fact:
        node_ip: "{{ lookup('file', 'inventory2.ini') | regex_search(inventory_hostname + ' ansible_host=(\\S+)', '\\1') | first }}"

    - name: Set ulimit for locked memory
      shell: ulimit -l unlimited
      args:
        executable: /bin/bash

    - name: Load sha_crypto kernel module
      shell: insmod {{ cwd }}/../kmodule/sha256_crypto.ko
      register: sha_insmod
      failed_when: sha_insmod.rc != 0 and 'File exists' not in sha_insmod.stderr

    - name: Load chacha20_kfunc kernel module
      shell: insmod {{ cwd }}/../kmodule/chacha20_kfunc.ko
      register: chacha_insmod
      failed_when: chacha_insmod.rc != 0 and 'File exists' not in chacha_insmod.stderr

    - name: Verify modules are loaded
      shell: lsmod | grep -E 'sha_crypto|chacha20_kfunc'
      register: lsmod_result
      failed_when: false

    - name: Report module load failures
      debug:
        msg: "WARNING: modules not fully loaded on {{ inventory_hostname }}: {{ lsmod_result.stdout }}"
      when: "'sha_crypto' not in lsmod_result.stdout or 'chacha20_kfunc' not in lsmod_result.stdout"

    - name: Add clsact qdisc to interface
      shell: >
        tc qdisc show dev {{ iface }} | grep -q clsact ||
        tc qdisc add dev {{ iface }} clsact
      register: qdisc_result
      failed_when: false

#    - name: Set MTU to {{ mtu }}
#      shell: ip link set dev {{ iface }} mtu {{ mtu }}

    - name: Load TC eBPF program
      shell: >
        tc filter add dev {{ iface }} egress bpf
        obj {{ cwd }}/{{ tc_obj }}
        sec {{ tc_sec }}
      register: tc_load
      failed_when: tc_load.rc != 0

    - name: Add authentication key for {{ node_ip }}/16
      shell: >
        {{ cwd }}/xdp_bpf_user add-hex {{ node_ip }}/16 {{ auth_key }}
      register: key_result
      failed_when: key_result.rc != 0

    - name: Enable SHA crypto kfunc mode
      shell: "{{ cwd }}/xdp_use_kfunc config_map 1"
      register: crypto_result
      failed_when: crypto_result.rc != 0

    - name: Verify TC filter is loaded
      shell: tc filter show dev {{ iface }} egress
      register: tc_verify
      failed_when: false

    - name: Report TC filter failure
      debug:
        msg: "WARNING: TC filter not loaded on {{ inventory_hostname }}"
      when: "'bpf' not in tc_verify.stdout"

    - name: Report key add failure
      debug:
        msg: "WARNING: Key add failed on {{ inventory_hostname }}"
      when: "key_result.rc != 0"

    - name: Report crypto mode failure
      debug:
        msg: "WARNING: Crypto mode failed on {{ inventory_hostname }}"
      when: "crypto_result.rc != 0"

